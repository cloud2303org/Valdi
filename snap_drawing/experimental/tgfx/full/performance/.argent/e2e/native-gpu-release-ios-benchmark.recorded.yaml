steps:
  - launch: io.valdiroutes.renderperformance
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: render-performance-status
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: render-performance-status
      expectedText: PASS
      textMatch: contains
    delayMs: 30000
