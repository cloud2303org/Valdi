[package]
name = "valdi-nsh-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
description = "Engine-independent extraction of NSH native HTTP and WebSocket transports"

[lib]
crate-type = ["rlib", "staticlib"]

[workspace]

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
ureq = "3.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
rustc-hash = "2.1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSOperation", "NSStream", "NSString", "NSURL", "NSURLRequest", "NSURLResponse", "NSURLSession"] }
block2 = "0.6.2"
rustc-hash = "2.1"

[[test]]
name = "loopback"
path = "tests/loopback/main.rs"
